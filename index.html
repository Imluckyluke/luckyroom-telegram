<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telegram Web Replica — Luckyroom UI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 240'><circle cx='120' cy='120' r='120' fill='%232AABEE'/><path fill='white' d='M170 78l-22 104c-1.6 7-6 8.7-12.2 5.4l-33.8-25-16.3 15.7c-1.8 1.8-3.3 3.3-6.8 3.3l2.4-34.2 62.3-56.3c2.7-2.4-.6-3.8-4.2-1.4L62 138 28.8 127.7c-7.2-2.3-7.3-7.2 1.5-10.7l132-51c6-2.3 11.2 1.4 9.7 11z'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app" class="app">

  <!-- ============ LEFT : CHAT LIST ============ -->
  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <button id="burger" class="icon-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </button>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" class="search-ic"><path d="M15.5 14h21.28l-.7.7-5.64 5.64a1 1 0 0 0 1.42 1.42l5.64-5.64.7-.7V14h-21.28a7 7 0 1 1 0-14 7 7 0 0 1 0 14zm0-12a5 5 0 1 0 0 10 5 5 0 0 0 0-10z" transform="translate(-14 0)"/></svg>
        <input id="search" type="text" placeholder="Search" autocomplete="off">
      </div>
    </div>

    <div class="stories" id="stories"></div>

    <nav class="folders" id="folders">
      <button class="folder active" data-f="all">All Chats</button>
      <button class="folder" data-f="personal">Personal</button>
      <button class="folder" data-f="groups">Groups</button>
      <button class="folder" data-f="channels">Channels</button>
    </nav>

    <div class="chat-list" id="chatList"></div>

    <button id="newChatBtn" class="fab" title="New message">
      <svg viewBox="0 0 24 24"><path d="M19 13.5A1.5 1.5 0 0 1 17.5 15H6l-3 3V4.5A1.5 1.5 0 0 1 4.5 3h14.5A1.5 1.5 0 0 1 20.5 4.5v9zM20 2H4a2 2 0 0 0-2 2v16l4.5-4H20a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-9 7h6v2H11zm-4 0h2v2H7zm4 4h6v2H11zm-4 0h2v2H7z" transform="scale(.92) translate(1 1)"/></svg>
    </button>
  </aside>

  <!-- ============ MAIN : CONVERSATION ============ -->
  <main id="main" class="main">
    <div id="emptyState" class="empty-state">
      <div class="empty-bubble">Select a chat to start messaging</div>
    </div>

    <div id="chatView" class="chat-view hidden">
      <header class="chat-head">
        <button id="backBtn" class="icon-btn back">‹</button>
        <div class="peer" id="peerBtn">
          <div class="avatar sm" id="peerAvatar">LR</div>
          <div class="peer-meta">
            <div class="peer-name" id="peerName">Name</div>
            <div class="peer-status" id="peerStatus">online</div>
          </div>
        </div>
        <div class="head-actions">
          <button class="icon-btn" id="searchMsgBtn" title="Search">
            <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 4.9 14.3l5 5a1 1 0 0 0 1.4-1.4l-5-5A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg>
          </button>
          <button class="icon-btn" title="Call">
            <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.6 15.6 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .57 3.6 1 1 0 0 1-.25 1z"/></svg>
          </button>
          <button class="icon-btn" id="infoBtn" title="Info">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
          </button>
        </div>
      </header>

      <div id="pinnedBar" class="pinned-bar hidden">
        <span class="pinned-line"></span>
        <div><b id="pinnedTitle">Pinned message</b><p id="pinnedText"></p></div>
        <button class="icon-btn" id="pinnedClose">✕</button>
      </div>

      <div id="msgs" class="msgs"></div>

      <div id="replyBar" class="reply-bar hidden">
        <span class="reply-line"></span>
        <div><b id="replyName"></b><p id="replyText"></p></div>
        <button class="icon-btn" id="replyClose">✕</button>
      </div>

      <footer class="composer">
        <button class="icon-btn" title="Attach">⌎</button>
        <div class="input-box">
          <input id="msgInput" type="text" placeholder="Write a message..." autocomplete="off">
          <button class="icon-btn" id="emojiBtn" title="Emoji">☺</button>
        </div>
        <button id="sendBtn" class="send-btn" title="Send">
          <svg id="sendIcon" viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </footer>

      <div id="emojiPop" class="emoji-pop hidden"></div>
    </div>
  </main>

  <!-- ============ RIGHT : INFO ============ -->
  <aside id="infoPanel" class="info hidden">
    <header><button class="icon-btn" id="infoClose">✕</button><b>Info</b><span></span></header>
    <div class="info-hero">
      <div class="avatar xl" id="infoAvatar">LR</div>
      <h2 id="infoName"></h2>
      <p id="infoStatus"></p>
    </div>
    <div class="info-row"><span>Notifications</span><label class="switch"><input type="checkbox" checked><i></i></label></div>
    <div class="info-row"><span>Media, files, links</span><b>›</b></div>
    <div class="info-grid" id="infoMedia"></div>
  </aside>
</div>

<!-- drawer -->
<div id="scrim" class="scrim hidden"></div>
<nav id="drawer" class="drawer">
  <div class="me"><div class="avatar lg">LU</div><b>Lucky User</b><p>+98 900 000 0000</p></div>
  <button>👥 New Group</button>
  <button>📢 New Channel</button>
  <button>👤 Contacts</button>
  <button>📞 Calls</button>
  <button>🔖 Saved Messages</button>
  <button id="themeBtn">🌙 Night Mode</button>
  <hr><button>⚙️ Settings</button>
</nav>

<script src="js/app.js"></script>
</body>
</html>
