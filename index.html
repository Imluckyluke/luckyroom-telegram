<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telegram — Luckyroom UI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 240'><circle cx='120' cy='120' r='120' fill='%233390EC'/><path fill='white' d='M170 78l-22 104c-1.6 7-6 8.7-12.2 5.4l-33.8-25-16.3 15.7c-1.8 1.8-3.3 3.3-6.8 3.3l2.4-34.2 62.3-56.3c2.7-2.4-.6-3.8-4.2-1.4L62 138 28.8 127.7c-7.2-2.3-7.3-7.2 1.5-10.7l132-51c6-2.3 11.2 1.4 9.7 11z'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="app">

  <!-- LEFT -->
  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <button id="burger" class="icon-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M3 5.5h18v1.8H3zM3 11.1h18v1.8H3zM3 16.7h18v1.8H3z"/></svg>
      </button>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" class="sic"><path d="M10 2a8 8 0 1 0 4.91 14.33l4.72 4.72a1 1 0 0 0 1.41-1.41l-4.72-4.72A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg>
        <input id="search" placeholder="Search" autocomplete="off">
        <span class="kbd">/</span>
      </div>
    </div>

    <div class="stories" id="stories"></div>
    <nav class="folders" id="folders"></nav>
    <div class="chat-list" id="chatList"></div>

    <button id="fab" class="fab" title="New message">
      <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-9 9H7V9h4V5h2v4h4v2h-4v4H9z"/></svg>
    </button>
  </aside>

  <!-- MAIN -->
  <main id="main" class="main">
    <div class="wall"></div>

    <div id="emptyState" class="empty-state">
      <div class="empty-card">
        <div class="empty-orb"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></div>
        <h3>Select a chat to start messaging</h3>
        <p>Choose from your existing conversations<br>on the left — just like Telegram Web.</p>
      </div>
    </div>

    <div id="chatView" class="chat-view hidden">
      <header class="chat-head">
        <button id="backBtn" class="icon-btn back">‹</button>
        <div class="peer" id="peerBtn">
          <div class="avatar sm" id="peerAvatar">—</div>
          <div class="peer-meta">
            <div class="peer-name"><span id="peerName"></span><span id="verified" class="verified hidden">✦</span></div>
            <div class="peer-status" id="peerStatus"></div>
          </div>
        </div>
        <div class="head-actions">
          <button class="icon-btn" id="searchMsgBtn" title="Search in chat"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 4.91 14.33l4.72 4.72a1 1 0 0 0 1.41-1.41l-4.72-4.72A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg></button>
          <button class="icon-btn" title="Voice call"><svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24 11.4 11.4 0 0 0 3.57.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02z"/></svg></button>
          <button class="icon-btn" id="infoBtn" title="More"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button>
        </div>
      </header>

      <div id="pinnedBar" class="pinned-bar hidden">
        <span class="pl"></span>
        <div class="pinned-thumb">📌</div>
        <div class="pinned-txt"><b>Pinned message</b><p id="pinnedText"></p></div>
        <button class="icon-btn" id="pinnedClose">✕</button>
      </div>

      <div id="msgs" class="msgs"></div>

      <button id="toBottom" class="to-bottom hidden">↓<span id="toBottomCount"></span></button>

      <div id="replyBar" class="reply-bar hidden">
        <span class="rl"></span>
        <div><b id="replyName"></b><p id="replyText"></p></div>
        <button class="icon-btn" id="replyClose">✕</button>
      </div>

      <footer class="composer-wrap">
        <div class="composer">
          <button class="icon-btn" title="Attach">＋</button>
          <div class="input-box">
            <input id="msgInput" placeholder="Write a message..." autocomplete="off">
            <button class="icon-btn" id="emojiBtn" title="Emoji"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-3.5 7a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm7 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM12 17.5a4.5 4.5 0 0 1-4-2.5h8a4.5 4.5 0 0 1-4 2.5z"/></svg></button>
          </div>
          <button id="sendBtn" class="send-btn" title="Send"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
        </div>
      </footer>
      <div id="emojiPop" class="emoji-pop hidden"></div>
    </div>
  </main>

  <!-- RIGHT -->
  <aside id="infoPanel" class="info hidden">
    <header><button class="icon-btn" id="infoClose">✕</button><b>Info</b><span style="width:40px"></span></header>
    <div class="info-hero">
      <div class="avatar xl" id="infoAvatar">—</div>
      <h2 id="infoName"></h2>
      <p id="infoStatus"></p>
    </div>
    <div class="info-row"><span>🔔 Notifications</span><label class="switch"><input type="checkbox" checked><i></i></label></div>
    <div class="info-row"><span>🖼 Media, files, links</span><b>›</b></div>
    <div class="info-grid" id="infoMedia"></div>
    <div class="info-row"><span>🌙 Night Mode</span><label class="switch"><input type="checkbox" id="nightSw" checked><i></i></label></div>
  </aside>
</div>

<div id="scrim" class="scrim hidden"></div>
<nav id="drawer" class="drawer">
  <div class="me"><div class="avatar lg">LU</div><div><b>Lucky User</b><p>+98 900 000 0000</p></div></div>
  <button>👥&nbsp; New Group</button>
  <button>📢&nbsp; New Channel</button>
  <button>👤&nbsp; Contacts</button>
  <button>📞&nbsp; Calls</button>
  <button>🔖&nbsp; Saved Messages</button>
  <button id="themeBtn">🌙&nbsp; Toggle Night Mode</button>
  <hr><button>⚙️&nbsp; Settings</button>
  <div class="ver">Telegram replica · Luckyroom UI v2</div>
</nav>

<div id="ctx" class="ctx hidden"></div>

<script src="js/app.js"></script>
</body>
</html>
